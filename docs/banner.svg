<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="create-glpi-plugin — scaffold a GLPI 11 / 12 plugin in one command">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="1010" cy="40" r="140" fill="#4f8ef7" fill-opacity="0.10" filter="url(#glow)"/>
  <circle cx="120" cy="300" r="120" fill="#22d3ee" fill-opacity="0.08" filter="url(#glow)"/>

  <!-- puzzle mark -->
  <g transform="translate(64 86)">
    <rect x="0" y="0" width="112" height="112" rx="24" fill="#111a2e" stroke="#2a3a5e"/>
    <path d="M36 30h14a8 8 0 1 1 16 0h14v14a8 8 0 1 0 0 16v14H66a8 8 0 1 1-16 0H36V60a8 8 0 1 1 0-16z" fill="url(#accent)"/>
  </g>

  <!-- title -->
  <text x="208" y="128" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">create-glpi-plugin</text>
  <text x="210" y="172" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#b6c2d9">Scaffold a GLPI 11 / 12 plugin in one command: rights, pages, settings, cron, tests,</text>
  <text x="210" y="201" font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="21" fill="#b6c2d9">a release workflow and a GLPI rulebook your coding agent reads.</text>

  <!-- command pill -->
  <g transform="translate(210 232)">
    <rect width="372" height="48" rx="12" fill="#0a0f1c" stroke="#2a3a5e"/>
    <circle cx="20" cy="24" r="5" fill="#ff5f57"/><circle cx="38" cy="24" r="5" fill="#febc2e"/><circle cx="56" cy="24" r="5" fill="#28c840"/>
    <text x="78" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#22d3ee">$</text>
    <text x="98" y="31" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" fill="#e2e8f0">npx create-glpi-plugin</text>
  </g>

  <!-- chips -->
  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600">
    <g transform="translate(612 240)"><rect width="120" height="32" rx="16" fill="#1d4ed8" fill-opacity="0.25" stroke="#3b82f6" stroke-opacity="0.5"/><text x="60" y="21" text-anchor="middle" fill="#93c5fd">GLPI 11 &amp; 12</text></g>
    <g transform="translate(742 240)"><rect width="104" height="32" rx="16" fill="#0e7490" fill-opacity="0.25" stroke="#22d3ee" stroke-opacity="0.5"/><text x="52" y="21" text-anchor="middle" fill="#a5f3fc">PHP 8.2+</text></g>
    <g transform="translate(856 240)"><rect width="150" height="32" rx="16" fill="#065f46" fill-opacity="0.25" stroke="#34d399" stroke-opacity="0.5"/><text x="75" y="21" text-anchor="middle" fill="#6ee7b7">AI rules built in</text></g>
    <g transform="translate(1016 240)"><rect width="120" height="32" rx="16" fill="#5b21b6" fill-opacity="0.25" stroke="#a78bfa" stroke-opacity="0.5"/><text x="60" y="21" text-anchor="middle" fill="#c4b5fd">no telemetry</text></g>
  </g>
</svg>
