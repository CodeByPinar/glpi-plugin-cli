<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="create-glpi-plugin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#15213a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f8ef7"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <circle cx="1100" cy="80" r="220" fill="#4f8ef7" fill-opacity="0.14" filter="url(#glow)"/>
  <circle cx="160" cy="600" r="200" fill="#22d3ee" fill-opacity="0.10" filter="url(#glow)"/>

  <!-- puzzle mark -->
  <g transform="translate(96 156)">
    <rect width="168" height="168" rx="36" fill="#111a2e" stroke="#2a3a5e" stroke-width="2"/>
    <path transform="translate(28 28) scale(1.6)" d="M22 10h14a8 8 0 1 1 16 0h14v14a8 8 0 1 0 0 16v14H52a8 8 0 1 1-16 0H22V40a8 8 0 1 1 0-16z" fill="url(#accent)"/>
  </g>

  <g font-family="Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif">
    <text x="300" y="214" font-size="68" font-weight="800" fill="#f8fafc" letter-spacing="-2">create-glpi-plugin</text>
    <text x="303" y="266" font-size="27" fill="#b6c2d9">Scaffold a GLPI 11 / 12 plugin in one command.</text>
    <text x="303" y="304" font-size="27" fill="#b6c2d9">Rights, pages, settings, cron, tests, release workflow</text>
    <text x="303" y="342" font-size="27" fill="#b6c2d9">and a GLPI rulebook your coding agent reads.</text>
  </g>

  <!-- command pill -->
  <g transform="translate(303 384)">
    <rect width="470" height="62" rx="14" fill="#0a0f1c" stroke="#2a3a5e" stroke-width="1.5"/>
    <circle cx="24" cy="31" r="6" fill="#ff5f57"/><circle cx="46" cy="31" r="6" fill="#febc2e"/><circle cx="68" cy="31" r="6" fill="#28c840"/>
    <text x="96" y="40" font-family="Consolas, Menlo, monospace" font-size="24" fill="#22d3ee">$</text>
    <text x="122" y="40" font-family="Consolas, Menlo, monospace" font-size="24" fill="#e2e8f0">npx create-glpi-plugin</text>
  </g>

  <!-- chips -->
  <g font-family="Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" transform="translate(303 478)">
    <g><rect width="150" height="40" rx="20" fill="#1d4ed8" fill-opacity="0.28" stroke="#3b82f6" stroke-opacity="0.6"/><text x="75" y="26" text-anchor="middle" fill="#93c5fd">GLPI 11 &amp; 12</text></g>
    <g transform="translate(164 0)"><rect width="126" height="40" rx="20" fill="#0e7490" fill-opacity="0.28" stroke="#22d3ee" stroke-opacity="0.6"/><text x="63" y="26" text-anchor="middle" fill="#a5f3fc">PHP 8.2+</text></g>
    <g transform="translate(304 0)"><rect width="184" height="40" rx="20" fill="#065f46" fill-opacity="0.28" stroke="#34d399" stroke-opacity="0.6"/><text x="92" y="26" text-anchor="middle" fill="#6ee7b7">AI rules built in</text></g>
    <g transform="translate(502 0)"><rect width="150" height="40" rx="20" fill="#5b21b6" fill-opacity="0.28" stroke="#a78bfa" stroke-opacity="0.6"/><text x="75" y="26" text-anchor="middle" fill="#c4b5fd">no telemetry</text></g>
  </g>

  <text x="1184" y="604" text-anchor="end" font-family="Segoe UI, Inter, Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">github.com/CodeByPinar/glpi-plugin-cli</text>
</svg>
