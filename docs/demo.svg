<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" role="img" aria-label="Animated terminal session of npx create-glpi-plugin: the key, the display name, the GLPI versions, the parts and the AI tools are asked, then 34 files are written and the first commit is made">
