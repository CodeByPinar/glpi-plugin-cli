    <g opacity="0"><text y="464"><tspan class="dim">└</tspan><tspan class="ye" dx="8">Next: copy into glpi/plugins/, then</tspan><tspan class="bl" dx="6">glpi:plugin:install inventorynotes -u glpi</tspan></text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.7588;0.7735;0.965;1" dur="17.0s" repeatCount="indefinite"/></g>
