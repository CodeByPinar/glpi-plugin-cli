name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: 20, php: '8.2' }
          - { node: 22, php: '8.3' }
          - { node: 24, php: '8.4' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: npm ci
      - run: npm run check

  scaffold:
    name: Scaffold and lint the output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: npm ci
      - name: Every part, GLPI 11 + 12
        run: node bin/create-glpi-plugin.js sample --features menu,config,itemtype,cron,tickettab --glpi both --yes --no-git --dir /tmp/sample
      - run: bash /tmp/sample/tests/lint.sh
      - name: Release archives of the sample
        run: python3 /tmp/sample/tools/package.py && ls -l /tmp/sample/dist
