# Release: push a tag "vX.Y.Z" matching package.json → GitHub release with the CHANGELOG section as notes, then
# an npm publish. Publishing uses npm Trusted Publishing (OIDC: this repository + this workflow file are registered
# as a trusted publisher of the package on npmjs.com, no token, no expiry). An NPM_TOKEN secret, when present, is
# used instead. A version that is already on npm is not published again.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Check the version
        id: v
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $VERSION"; exit 1
          fi

      - run: npm ci
      - run: npm run check

      - name: Release notes from CHANGELOG.md
        run: node scripts/release-notes.js "${{ steps.v.outputs.version }}" > release-notes.md && cat release-notes.md

      - name: Is this version already on npm?
        id: npm
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          PUBLISHED=$(npm view "create-glpi-plugin@${{ steps.v.outputs.version }}" version 2>/dev/null || true)
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "has_token=$HAS_TOKEN" >> "$GITHUB_OUTPUT"
          if [[ -n "$PUBLISHED" ]]; then echo "::notice::create-glpi-plugin@$PUBLISHED is already on npm, publish skipped"; fi

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: create-glpi-plugin ${{ steps.v.outputs.version }}
          body_path: release-notes.md

      # Trusted Publishing needs npm 11.5.1 or newer; Node 22 ships an older npm.
      - name: Update npm
        if: steps.npm.outputs.published == ''
        run: npm install -g npm@latest && npm --version

      - name: Publish to npm (trusted publishing)
        if: steps.npm.outputs.published == '' && steps.npm.outputs.has_token != 'true'
        run: npm publish --provenance --access public

      - name: Publish to npm (token)
        if: steps.npm.outputs.published == '' && steps.npm.outputs.has_token == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
